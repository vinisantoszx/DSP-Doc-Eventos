sistema:
  armazenamento:
    documentos: "storage/documentos"
    metadata: "storage/metadata"
    backups: "storage/backups"
  upload:
    tamanho_maximo_mb: 50
  seguranca:
    algoritmo_hash: "SHA-256"
  backup:
    formato: "zip"

version: 1
disable_existing_loggers: False

formatters:
  padrao:
    format: "%(asctime)s | %(levelname)s | %(message)s"

handlers:
  file:
    class: logging.FileHandler
    filename: "./storage/logs/sistema.log"
    formatter: padrao
    encoding: utf-8

loggers:
  CofreEventos:
    level: INFO
    handlers: [file]
    propagate: False 